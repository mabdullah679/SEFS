# No web server: the reader serves nothing, it only polls the share.
spring.main.web-application-type=none
# Keep the JVM up on the scheduler thread even with no web server.
spring.main.keep-alive=true
spring.main.banner-mode=off
spring.application.name=sefs-reader
# Bare message per line: contract log lines (READ ..., WRITE_PROBE ...) start at column 0,
# exactly like the writer's. CloudWatch adds its own timestamp.
logging.pattern.console=%m%n
logging.level.root=WARN
logging.level.com.sefs.reader=INFO
