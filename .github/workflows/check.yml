# "check": push to main with the word `check` in the commit message and the changed
# children get re-applied, then the live verifier runs. Root wiring changes apply the
# whole mother. Nothing else on push: unit tests run on every push regardless.
#
# Prerequisites (one-time, owner, see docs/CI.md):
#   - remote Terraform state (S3 backend) shared with the owner's machine
#   - an OIDC deploy role for this repo; its ARN in the repository variable AWS_DEPLOY_ROLE_ARN
#   - repository variables AWS_REGION, AWS_ACCOUNT_ID (account guard), TF_STATE_BUCKET, TF_LOCK_TABLE
name: check

on:
  push:
    branches: [main]

permissions:
  id-token: write   # OIDC to AWS
  contents: read

concurrency:
  group: sefs-deploy       # one apply at a time; the state lock backs this up
  cancel-in-progress: false

jobs:
  unit:
    name: unit + mutation-free local proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8", terraform_wrapper: false }
      - run: bash tests/unit/run.sh
      - run: bash tests/ci/selftest.sh
      - run: bash tests/setup/selftest.sh
        if: false   # needs `expect`; enabled once the runner image is confirmed to have it

  deploy:
    name: apply changed children + verify
    needs: unit
    if: contains(github.event.head_commit.message, 'check')
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_allowed_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_image_build_timeout_seconds: "2400"   # x86 runner builds arm64 images under QEMU: slower than native
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8", terraform_wrapper: false }
      - name: OIDC claims (iss/aud/sub only, never the token)
        run: |
          tok="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)"
          printf '%s' "$tok" | cut -d. -f2 | tr '_-' '/+' | awk '{ l = length($0) % 4; if (l == 2) $0 = $0 "=="; else if (l == 3) $0 = $0 "="; print }' | base64 -d | jq '{iss, aud, sub, repository, ref, event_name}'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: docker/setup-qemu-action@v3      # images are linux/arm64; the runner is x86
      - uses: docker/setup-buildx-action@v3
      - name: which children changed
        id: diff
        run: |
          base="${{ github.event.before }}"
          git cat-file -e "$base" 2>/dev/null || base="$(git rev-parse HEAD~1)"
          echo "children=$(bash scripts/changed-children.sh "$base" HEAD)" | tee -a "$GITHUB_OUTPUT"
      - name: backend config from repository variables (written by `make bootstrap` locally)
        run: |
          cat > backend.hcl <<EOF
          bucket         = "${{ vars.TF_STATE_BUCKET }}"
          key            = "sefs/terraform.tfstate"
          region         = "${{ vars.AWS_REGION }}"
          dynamodb_table = "${{ vars.TF_LOCK_TABLE }}"
          encrypt        = true
          EOF
      - run: terraform init -input=false -backend-config=backend.hcl
      - name: apply
        env: { CHILDREN: "${{ steps.diff.outputs.children }}" }
        run: |
          set -euo pipefail
          if [ "$(terraform state list 2>/dev/null | wc -l)" -eq 0 ]; then
            echo "remote state is empty: the first deploy is always a full apply"; CHILDREN=full
          fi
          case "$CHILDREN" in
            none) echo "nothing deployable changed; verify only" ;;
            full) terraform apply -input=false -auto-approve ;;
            *)    targets=(); for c in $CHILDREN; do targets+=(-target="module.$c"); done
                  terraform apply -input=false -auto-approve "${targets[@]}" ;;
          esac
      - name: no leftover drift after a targeted apply
        run: terraform plan -input=false -detailed-exitcode
      - name: live verify (every R-ID against AWS)
        run: sudo apt-get install -y -q jq >/dev/null && bash tests/live/verify.sh
